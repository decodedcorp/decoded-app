name: Documentation Validation

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/.schema/**'
      - 'docs/scripts/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**/*.md'
      - 'docs/.schema/**'
      - 'docs/scripts/**'

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    name: Validate Documentation System

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history in staleness checks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g ajv-cli ajv-formats
          npm install --save-dev globby gray-matter

      - name: Validate frontmatter schema
        run: |
          echo "📋 Validating document frontmatter..."
          node docs/scripts/validate-schema.mjs

      - name: Build document index
        run: |
          echo "🔨 Building document index..."
          node docs/scripts/build-index.mjs

      - name: Verify document relationships
        run: |
          echo "🔗 Verifying PRD ↔ Plan bidirectional links..."
          node docs/scripts/verify-relations.mjs

      - name: Build redirect map
        run: |
          echo "🗺️ Building redirect map from tombstones..."
          node docs/scripts/build-redirects.mjs

      - name: Validate redirect targets
        run: |
          echo "✅ Validating all redirect targets exist..."
          node -e "
            const fs = require('fs');
            const redirects = JSON.parse(fs.readFileSync('docs/.generated/redirects.json', 'utf-8'));
            let errors = 0;
            for (const redirect of redirects) {
              if (!fs.existsSync(redirect.to)) {
                console.error(\`❌ Redirect target not found: \${redirect.to}\`);
                console.error(\`   From: \${redirect.from}\`);
                errors++;
              }
            }
            if (errors > 0) {
              console.error(\`\n❌ \${errors} redirect target(s) missing\`);
              process.exit(1);
            }
            console.log('✅ All redirect targets validated');
          "

      - name: Check for broken internal links
        run: |
          echo "🔍 Checking for broken markdown links..."
          npx lychee \
            --offline \
            --no-progress \
            --exclude-path docs/99-archive \
            --exclude-path node_modules \
            'docs/**/*.md'

      - name: Run full sync check
        run: |
          echo "🔄 Running comprehensive sync check..."
          bash docs/scripts/check-sync.sh --strict

      - name: Generate validation report
        if: always()
        run: |
          echo "📊 Generating validation report..."
          node -e "
            const fs = require('fs');

            console.log('\n═══════════════════════════════════════════');
            console.log('📊 DOCUMENTATION VALIDATION REPORT');
            console.log('═══════════════════════════════════════════\n');

            // Stats from index
            if (fs.existsSync('docs/.generated/stats.json')) {
              const stats = JSON.parse(fs.readFileSync('docs/.generated/stats.json', 'utf-8'));
              console.log('📈 Document Statistics:');
              console.log(\`   Total documents: \${stats.total}\`);
              console.log(\`   By type: \${JSON.stringify(stats.by_type, null, 2).replace(/\\n/g, '\\n   ')}\`);
              console.log(\`   By status: \${JSON.stringify(stats.by_status, null, 2).replace(/\\n/g, '\\n   ')}\`);
              if (stats.missing_ids && stats.missing_ids.length > 0) {
                console.log(\`   ⚠️ Documents missing IDs: \${stats.missing_ids.length}\`);
              }
              console.log('');
            }

            // Redirect stats
            if (fs.existsSync('docs/.generated/redirect-stats.json')) {
              const redirectStats = JSON.parse(fs.readFileSync('docs/.generated/redirect-stats.json', 'utf-8'));
              console.log('🔗 Redirect Statistics:');
              console.log(\`   Total redirects: \${redirectStats.total_redirects}\`);
              console.log(\`   Total tombstones: \${redirectStats.total_tombstones}\`);
              console.log('');
            }

            console.log('✅ All validation checks passed!');
          "

  lint-commit-messages:
    runs-on: ubuntu-latest
    name: Lint Commit Messages
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          echo "📝 Validating commit messages..."
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check-spec-references:
    runs-on: ubuntu-latest
    name: Check Spec References
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for spec references in commits
        run: |
          echo "🔍 Checking for spec references in commit messages..."

          commits=$(git log --format=%B ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          # Check if any docs changes exist
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -q '^docs/'; then
            echo "📄 Documentation changes detected"

            # For doc changes, recommend spec references
            if ! echo "$commits" | grep -qE 'spec\((PRD-|PLAN-|ADR-|SPEC-)[A-Z0-9-]+\)'; then
              echo "⚠️ No spec references found in commits"
              echo "💡 Consider adding spec references to commit messages:"
              echo "   git commit -m \"docs(grid): update PRD spec(PRD-TG-0002)\""
            else
              echo "✅ Spec references found in commits"
            fi
          fi
