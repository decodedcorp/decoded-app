id: FEATURE-sample-feature
title: "Sample feature: Improve orderbook depth visualization"

context:
  problem: >
    Users cannot easily understand the executable price range and depth on the current orderbook UI.
  user_story: >
    As a beginner trader, I want to see the executable price range and the relative depth at a glance,
    so that I can make faster and more confident decisions.

requirements:
  functional:
    - Calculate cumulative volume and percentage for both bid and ask sides.
    - Highlight the currently selected price level and its relative position within the depth.
  non_functional:
    - Do not introduce noticeable regression on LCP or frame rate.
    - Maintain smooth interactions (~60fps) on both mobile and desktop for typical loads.

acceptance_criteria:
  - In a manual test with 3 users, at least 2 report that they can clearly identify executable ranges.
  - No additional clicks are required compared to the previous version to understand depth.

non_goals:
  - Introducing a new charting library is out of scope.
  - Any change to backend APIs is out of scope.

notes:
  related_prd: "PRD-ORDERBOOK-001"
  related_issue: "#123"

